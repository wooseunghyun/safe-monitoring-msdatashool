<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Safe Monitoring</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- 공통 CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

  <!-- Kakao Map -->
  <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey={{ kakao_key }}&libraries=clusterer,services"></script>
</head>
<body>

  <!-- ✅ 예전이랑 동일하게: top-bar / top-tab -->
  <header class="top-bar">
    <div class="top-bar-left">
      <div class="top-logo">S</div>
      <span>Safe Monitoring</span>
    </div>

    <div class="top-bar-right">
      <a href="/map"
         class="top-tab {% if active_page=='map' %}active{% endif %}">
        지도
      </a>
      <a href="/dashboard"
         class="top-tab {% if active_page=='dashboard' %}active{% endif %}">
        Power BI
      </a>
      <a href="/login"
         class="top-tab {% if active_page=='login' %}active{% endif %}">
        Login
      </a>
    </div>
  </header>

  <!-- 본문 -->
  <main class="page-container">
    {% block content %}{% endblock %}
  </main>

  <!-- 공통 UI 스크립트 -->
  <script src="{{ url_for('static', filename='js/ui.js') }}"></script>
</body>
</html>
