<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Safe Monitoring</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- 외부 CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

  <!-- Kakao 지도 SDK -->
  <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey={{ kakao_key }}&libraries=clusterer,services"></script>
</head>
<body>

    </div>
  </div>
  <!-- 상단 바 -->
  <header class="top-bar">
    <div class="top-bar-left">
      <div class="top-logo">S</div>
      <span>Safe Monitoring</span>
    </div>
    <div class="top-bar-right">
      <!-- 라우트 이름에 맞게 href는 필요하면 수정해서 써도 돼요 -->
      <a href="/map" class="top-tab active">지도</a>
      <a href="/powerbi" class="top-tab">Power BI</a>
    </div>
  </header>

  <!-- 신고 중 배너 (빨간 바) -->
  <div id="alert-banner" class="alert-bar" style="display:none;">
    <div class="alert-bar-left">신고중</div>
    <button id="alert-cancel-btn" class="alert-cancel-btn">신고 취소</button>
  </div>

  <!-- 메인 레이아웃 -->
  <main class="main-layout">
    <!-- 지도 영역 -->
    <section class="map-area">
      <div id="map"></div>
    </section>

    <!-- 우측 사이드 패널 (PC 기준) / 모바일에서는 아래에서 슬라이드 -->
    <aside class="side-panel" id="side-panel">
      <div class="side-card">
        <h3 class="panel-title">지도에서 끄기</h3>

        <div class="panel-section">
          <label class="check-row">
            <input type="checkbox" id="toggle-cctv" checked>
            <span>CCTV</span>
          </label>
          <label class="check-row">
            <input type="checkbox" id="toggle-bells" checked>
            <span>안심벨</span>
          </label>
        </div>

        <hr class="panel-divider">

        <div class="panel-section">
          <button id="btn-my-location" class="panel-btn wide">
            출발지를 내 위치로
          </button>
          <button id="btn-safe-route" class="panel-btn wide">
            AI 추천 경로
          </button>
        <button id="btn-reset" class="panel-btn wide">경로 초기화</button>
        <button id="btn-sort" class="panel-btn wide">경유지 정렬</button>
        </div>

        <hr class="panel-divider">

        <!-- 이 두 개가 PC에선 사이드 패널 안, 모바일에선 화면 맨 아래로 내려갑니다 -->
        <!-- side-actions 안쪽 -->
        <div class="side-actions">
        <button id="btn-record" class="panel-btn primary">
            <!-- 빨간 점 / 상태 텍스트 / 타이머를 위한 구조 -->
            <span id="record-indicator" class="rec-dot"></span>
            <span id="record-text" class="rec-text">음성 모니터링 시작</span>
            <span id="record-timer" class="rec-timer">00:00</span>
        </button>

        <button id="btn-direct-alert" class="panel-btn danger">
            바로 신고
        </button>
        </div>

        <span id="rec-status" class="rec-status"></span>

      </div>
    </aside>
  </main>

  <!-- 모바일용: 사이드 패널 열기/닫기 버튼 -->
  <button id="mobile-panel-toggle" class="mobile-panel-toggle">
    펼치기
  </button>

  <!-- 기존 지도 로직 -->
  <script src="{{ url_for('static', filename='js/map.js') }}"></script>


  <!-- 간단한 UI 스크립트: 모바일 패널 토글 -->
  <script>
    (function() {
      const sidePanel = document.getElementById('side-panel');
      const toggleBtn = document.getElementById('mobile-panel-toggle');

      if (!sidePanel || !toggleBtn) return;

      function isMobile() {
        return window.matchMedia("(max-width: 768px)").matches;
      }

      function updateToggleVisibility() {
        // 모바일에서만 '펼치기' 버튼 보이기
        if (isMobile()) {
          toggleBtn.style.display = 'block';
        } else {
          toggleBtn.style.display = 'none';
          sidePanel.classList.remove('open');
        }
      }

      toggleBtn.addEventListener('click', () => {
        sidePanel.classList.toggle('open');
        toggleBtn.textContent = sidePanel.classList.contains('open') ? '접기' : '펼치기';

        // 지도 리사이즈 필요하면 활성화 (window.map 사용 중이면)
        if (window.kakao && window.kakao.maps && window.map) {
          window.kakao.maps.event.trigger(window.map, 'resize');
        }
      });

      window.addEventListener('resize', updateToggleVisibility);
      updateToggleVisibility();
    })();
  </script>
</body>
</html>
